<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
  </g>

  <!-- Outer Glow Circle -->
  <circle cx="200" cy="180" r="105" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="200" cy="180" r="85" fill="#27272a" stroke="#3f3f46" stroke-width="2" filter="url(#glow)"/>

  <!-- Category Layered Box / Grid / Shopping Icon -->
  <g transform="translate(145, 125)">
    <!-- Back Diamond / Layer -->
    <path d="M55 10 L95 30 L55 50 L15 30 Z" fill="#D12929" opacity="0.4" />
    <!-- Middle Diamond / Layer -->
    <path d="M55 35 L95 55 L55 75 L15 55 Z" fill="#D12929" opacity="0.75" />
    <!-- Front Diamond / Layer -->
    <path d="M55 60 L95 80 L55 100 L15 80 Z" fill="url(#primaryGrad)" />
    
    <!-- Gold Sparkle Top-Right -->
    <path d="M90 15 Q95 20 100 20 Q95 20 90 25 Q90 20 85 20 Q90 20 90 15 Z" fill="url(#goldGrad)" />
    <circle cx="20" cy="20" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- Category Placeholder Badge Text -->
  <rect x="90" y="300" width="220" height="36" rx="18" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="200" y="323" fill="#E4E4E7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">MAGMATI CATEGORY</text>
</svg>
